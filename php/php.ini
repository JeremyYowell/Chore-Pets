; ── Chore Pets – PHP settings for Dreamhost FastCGI ─────────────────────────
; Place this file in the same directory as index.php.
; Dreamhost's FastCGI respects php.ini (or .user.ini) in the web root.

; Don't leak the PHP version in response headers
expose_php = Off

; Alexa payloads are tiny – 2 MB ceiling is generous
post_max_size = 2M
upload_max_filesize = 1M

; Alexa requires a skill response within 8 seconds; bail at 7
max_execution_time = 7

; Keep error output out of the HTTP response (log instead)
display_errors = Off
log_errors = On
